<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,viewport-fit=cover"> <!-- minimum-scale: iOS Safari keeps the portrait zoom after rotating to landscape without it -->
<title>NEMTV</title>
<style>html.andr #pfs{display:none!important}
/* NEMOS dark tokens, copied from the live local NEMOS (whisper-hub/nemos-src) */
@font-face{font-family:"NemFB";src:local("Inter Bold"),local("Inter-Bold"),local("Roboto Bold"),local("Roboto-Bold"),local("Arial Bold"),local("Arial-BoldMT");font-weight:400}
@font-face{font-family:"Jersey M54";src:url(jersey.ttf) format("truetype");unicode-range:U+002E,U+0030-0039,U+0041-005A,U+0061-007A}
:root{
  --bg:#0F0E11;--surface:#19171C;--surface-2:#242128;--line:#2D2A31;--line-strong:#3B3741;
  --ink:#F2F0F4;--ink-2:#C9C4CF;--muted:#8F8996;--accent:#F0435F;
  --red:#D21F3C;--red-3:#B8182F;--coral:#FF8A5B;--plum:#2B2731;--wine:#5C2330;--island:#211E25;
  --gl-fill:#211E25;--safe-x:max(env(safe-area-inset-left,0px),env(safe-area-inset-right,0px));--safe-y:max(env(safe-area-inset-top,0px),env(safe-area-inset-bottom,0px));--h-ctl:34px;--pad-x:max(28px,var(--safe-x),calc((100vw - 1280px)/2));
  --ring:0 0 0 2px #0F0E11,0 0 0 5px #F2F0F4;--ring-in:inset 0 0 0 2px #0F0E11,inset 0 0 0 5px #F2F0F4;
}
@media(min-width:900px) and (min-aspect-ratio:3/2){:root{--safe-x:48px;--safe-y:27px}}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{display:grid;grid-template-rows:auto minmax(0,1fr)}
html,body{height:100%;background:var(--bg);color:var(--ink);font:12px/1.35 Inter,system-ui,sans-serif;overflow:hidden}
button,input{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;text-align:inherit}
.disp{font-family:"Jersey M54","NemFB",Inter,sans-serif;text-transform:uppercase;font-synthesis:none;letter-spacing:.02em}
@font-face{font-family:"NemInter";src:url(inter-bold.ttf) format("truetype");font-weight:700}
.tmn{font-family:"NemInter",Inter,system-ui,sans-serif;font-weight:700;letter-spacing:-.01em} /* team names: Inter, as written (Brock 2026-11-21) */

header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:max(10px,var(--safe-y)) var(--pad-x) 6px}
.brand{justify-self:start;display:flex}.brand img{height:18px}
nav{display:flex;gap:4px;padding:3px;border-radius:999px;background:var(--gl-fill);border:1px solid var(--line)}
nav{gap:2px}header [data-t]{display:flex;align-items:center;justify-content:center;gap:6px;padding:6px 15px 6px 13px;min-height:var(--h-ctl);border-radius:999px;color:var(--ink-2);font-weight:600;text-align:center}nav button svg{flex:none}
#setb{grid-column:3;justify-self:end;width:34px;height:34px;padding:0;border-radius:50%;background:var(--gl-fill);border:1px solid var(--line)}
#setb[aria-pressed=true]{background:rgba(244,242,246,.86)}
header [data-t][aria-pressed=true]{background:rgba(244,242,246,.86);color:#141217}
:focus{outline:none}
button:focus-visible,input:focus-visible,.focusable:focus{box-shadow:var(--ring)}


main{min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:4px var(--pad-x) max(24px,var(--safe-y));scrollbar-width:none}
main::-webkit-scrollbar{display:none}
main::after{content:"";display:block;height:62%}
h2{font-size:15px;margin:10px 0 8px}
.sub{color:var(--muted);margin-bottom:8px}
.empty{color:var(--muted);padding:16px 0}.gerr{font-size:16px;display:flex;flex-direction:column;align-items:flex-start;gap:12px}
/* skeletons (UI-RULES 25): .sk = a plain block, .skm = a real card drawn by its own renderer with its content hidden, so sizes match. Both fade in after 150ms (a cache hit replaces them before that) and shimmer with one transform-only layer. */
.sk,.skm{position:relative;overflow:hidden;background:var(--surface-2)!important;box-shadow:none!important;filter:none!important;border-color:transparent!important;pointer-events:none;opacity:0;animation:skv 1ms linear .15s forwards}
.sk{display:block;border-radius:6px}
.skm *{visibility:hidden}
@keyframes skv{to{opacity:1}}@keyframes skbg{to{background-color:var(--surface-2)}}
img[src]:not(.ld){animation:skbg 1ms linear .15s forwards}

/* game cards (lite): flat surface, away colour on the left edge, home colour on the right; no gradients, shadows or animation */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}

.pill{position:relative;min-height:112px;border-radius:14px;text-align:center;color:#fff;background:var(--surface);border:1px solid var(--line);
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:10px 8px 28px}
.pill .side{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.pill .side img{width:44px;height:44px;object-fit:contain}
.pill .tm{font-size:13px;line-height:1.05;overflow-wrap:normal;word-break:normal;hyphens:none;text-wrap:balance}
.pill .mid{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:0 4px}
.pill .vs{color:rgba(255,255,255,.8);font-size:12px}
.pill .live{position:absolute;bottom:6px;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:4px;font-size:12px;color:rgba(255,255,255,.9);font-weight:700;letter-spacing:.1em}
.pill .scr{font-size:22px;line-height:1;color:#fff;letter-spacing:.02em}

/* chips (Live filters, Home shortcuts) */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{padding:5px 12px;min-height:var(--h-ctl);display:inline-flex;align-items:center;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--ink-2);font-weight:600;white-space:nowrap}
.chip[aria-pressed=true]{background:rgba(244,242,246,.86);color:#141217;border-color:transparent}


/* settings */
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 12px;margin-bottom:5px;border-radius:999px;background:var(--surface);border:1px solid var(--line);width:300px}
.sw{width:26px;height:15px;border-radius:999px;background:var(--line-strong);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:11px;height:11px;border-radius:50%;background:var(--ink-2)}
.row[aria-checked=true] .sw{background:var(--ink)}
.row[aria-checked=true] .sw::after{transform:translateX(11px);background:#141217}
.field{display:flex;gap:6px;align-items:center;margin-bottom:10px}
.field input{width:360px;padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line-strong)}
.btn{padding:6px 16px;border-radius:999px;background:rgba(244,242,246,.86);color:#141217;font-weight:700;text-align:center}

/* splash */
#boot{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
#boot .ttl{position:relative;font-size:64px;line-height:1}
#boot .tag{position:relative;color:var(--ink-2);letter-spacing:.28em;font-size:12px}
#boot .st{position:relative;color:var(--muted);font-size:12px;min-height:14px}

/* player */
#pl{position:fixed;inset:0;z-index:50;background:#000;display:none;overflow:hidden}
#pl.on{display:block}
#pl video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transform-origin:center}
.ptop,.ctl{position:absolute;left:0;right:0;display:flex;align-items:center;justify-content:center}
.ptop{top:0;padding:max(12px,var(--safe-y)) max(28px,var(--safe-x)) 12px;gap:10px;background:rgba(0,0,0,.6)}
.ptop .ptt{flex:1;display:flex;align-items:center;justify-content:center;gap:10px;min-width:0}
.pbtn{padding:6px 14px;border-radius:999px;background:rgba(244,242,246,.92);border:2px solid var(--line-strong);color:#141217;font-weight:800;font-size:12px;white-space:nowrap;min-height:var(--h-ctl);display:inline-flex;align-items:center;justify-content:center}
.pbtn:focus-visible{border-color:var(--ink)}
.ptop img{width:26px;height:26px;object-fit:contain}
.ptop .t{font-size:15px}
.ptop .tag{padding:2px 10px;border-radius:999px;background:var(--gl-fill);border:1px solid var(--line-strong);color:var(--ink-2);font-size:13px;letter-spacing:.1em}
.ctl{bottom:max(16px,var(--safe-y));padding:0 var(--safe-x);gap:6px;flex-wrap:nowrap}
#bfeed{max-width:180px;overflow:hidden;text-overflow:ellipsis}
.ctl .grp{display:flex;align-items:center;gap:2px;padding:3px;border-radius:999px;background:var(--gl-fill);border:1px solid var(--line-strong)}
.ctl button{padding:6px 14px;min-height:var(--h-ctl);border-radius:999px;color:var(--ink);font-weight:600;white-space:nowrap;text-align:center}
.ctl button.sm{padding:6px 10px}
#pl.hide,#pl.hide *{cursor:none}
#pl.hide .ptop,#pl.hide .ctl{opacity:0;pointer-events:none}
/* score bar: today's other NHL games along the bottom, shown while the player controls are hidden; Scores in the player turns it on/off */
#sbar{position:absolute;left:0;right:0;bottom:0;height:6.25%;min-height:33px;display:none;align-items:stretch;gap:3px;padding:2px var(--safe-x) 5px;overflow:hidden;opacity:0;transition:opacity .2s;container-type:size}
#pl.sb #sbar{display:flex}#pl.sb.hide #sbar{opacity:1}
.sbi{flex:0 0 auto;display:flex;align-items:center;gap:5px;padding:0 10px;border-radius:999px;background:var(--surface);color:#fff;white-space:nowrap;zoom:var(--sbz,1)}
.sbi:first-child{margin-left:auto}.sbi:last-child{margin-right:auto}
.sbi img,.sbi b{width:70cqh;height:70cqh;object-fit:contain;font-size:34cqh;line-height:70cqh;text-align:center}
.sbi .scr{font-size:48cqh}.sbi .nt{font-size:34cqh;color:var(--ink-2)}.sbi.done{opacity:.55}
.ctl button[aria-pressed=true]{box-shadow:inset 0 0 0 2px var(--ink)}.ctl button[aria-pressed=true]:not(#bfav)::after{content:"\2713";margin-left:6px}.ctl button[aria-pressed=true]:focus-visible{box-shadow:inset 0 0 0 2px var(--ink),var(--ring)}
.pmenu{position:absolute;left:50%;bottom:62px;transform:translateX(-50%);max-height:62%;overflow-y:auto;scrollbar-width:none;min-width:260px;max-width:420px;
  padding:6px;border-radius:22px;background:var(--surface);border:1px solid var(--line-strong)}
.pmenu::-webkit-scrollbar{display:none}
.pmenu button{display:flex;align-items:center;min-height:32px;justify-content:space-between;gap:12px;width:100%;padding:7px 14px;border-radius:999px;text-align:left}
.pmenu button[aria-checked=true]{background:rgba(242,240,244,.86);color:#141217;font-weight:700}
.pmenu small{color:var(--muted)}
.pmenu button[aria-checked=true] small{color:#4B4652}
.pmenu h3{font-size:13px;color:var(--muted);letter-spacing:.1em;padding:4px 14px 6px}
#pbuf{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;overflow:hidden;background:#0b0a0d;pointer-events:none}
#pbuf.on{display:flex}
#pbuf .tm2{position:relative;display:flex;align-items:center;justify-content:center;gap:34px}
#pbuf .tm2 .tt{display:flex;flex-direction:column;align-items:center;gap:8px;width:190px;text-align:center}
#pbuf .tm2 img{width:64px;height:64px;object-fit:contain}
#pbuf .nm{font-size:15px;line-height:1.05}
#pbuf .vs2{font-size:13px;color:rgba(255,255,255,.75)}
#pbuf .chn{position:relative;font-size:30px}
#pbuf .stt{position:relative;color:var(--ink-2);font-size:13px;min-height:18px;text-align:center} /* lite: a plain status line instead of an animated bar */
#pbuf.mini{inset:auto;left:50%;top:54px;transform:translateX(-50%);background:var(--gl-fill);border:1px solid var(--line-strong);border-radius:999px;padding:6px 14px;flex-direction:row;gap:10px}
#pbuf.mini .tm2,#pbuf.mini .chn{display:none}
.lzh{display:flex;align-items:center;justify-content:space-between;flex:none}
.lzh h2{margin:0}
.pbtn:focus{outline:none;box-shadow:var(--ring)}
.srl{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;align-items:start} /* a short pre-game row keeps its own height */
.sr{position:relative;border-radius:14px;padding:10px 12px;color:#fff;text-align:left;display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line)}
.srt{display:flex;align-items:center;gap:8px}.srs{display:flex;align-items:center;gap:6px;flex:1}.srs:last-of-type{justify-content:flex-end}
.srs img{width:28px;height:28px}.srs b{font-size:20px}.srm{font-size:26px;min-width:76px;text-align:center}.srn{font-size:12px;color:var(--muted);min-width:64px;text-align:right}
.srg{display:flex;flex-direction:column;gap:2px;font-size:12px;background:rgba(10,9,12,.5);border-radius:12px;padding:6px 9px}.srg.none{color:var(--muted)}
.srg i{font-style:normal;font-size:12px;letter-spacing:.08em;color:var(--muted)}.gl em{font-style:normal;color:var(--muted)}.gl.new{color:#fff}.gl:not(.new){color:var(--ink-2)}
/* finished games: grey edges, dimmed loser */
.pill.done,.sr.done{background:#141317;border-color:#222025;color:var(--muted)}
.pill.done img,.sr.done img{filter:grayscale(1);opacity:.55}
.pill.done .scr,.sr.done .srm{color:var(--ink-2)}
.lose{opacity:.75}
.pill.done .live{letter-spacing:.24em;color:var(--ink-2)}
.chip.ft{display:inline-flex;align-items:center;gap:6px;padding:4px 12px 4px 6px}.chip.ft img{width:22px;height:22px;object-fit:contain}.chip.ft[aria-pressed=true]::after{content:"\2713";color:#141217;font-size:13px}
.fstar{position:absolute;top:6px;left:8px;width:20px;height:20px;border-radius:50%;background:#fff;color:#141217;font-size:13px;line-height:20px;text-align:center;z-index:3}.sr .fstar{top:50%;left:9px;margin-top:-10px}.sr.fv{padding-left:36px}
.gs{display:flex;gap:8px;align-items:center;margin-bottom:8px}.gs input{flex:1;padding:7px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--ink)}
#m{scroll-padding-bottom:12px}
#zb{position:absolute;right:34px;top:50%;transform:translateY(-50%);width:300px;z-index:7;display:none;flex-direction:column;gap:6px}#zb.on{display:flex}
#zb div{padding:8px 14px;border-radius:14px;background:rgba(15,14,17,.82);border:1px solid var(--line-strong);opacity:.7}
#zb div.c{opacity:1;background:rgba(242,240,244,.92);color:#141217}#zb b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#zb small{font-size:12px;color:var(--ink-2)}#zb div.c small{color:#4B4652}
.chips.one{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.chips.one::-webkit-scrollbar{display:none}
/* Live (lite): search, category chips, then one scrolling list with one button per channel (logo, name, what is on now). Only the list scrolls */
main.live{display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;overflow:hidden;padding:4px var(--pad-x) 0}
main.live::after{display:none}
main.live .gs{margin:0 0 8px;max-width:720px}
main.live .chips.one{margin-bottom:8px}
main.live .chip{padding:3px 10px;font-size:12px}
#gx{min-height:0;overflow-y:auto;scrollbar-width:none;padding:4px}#gx::-webkit-scrollbar{display:none}
.gr{margin-bottom:6px;content-visibility:auto;contain-intrinsic-size:auto 48px} /* off-screen rows skip layout and paint */
.gc{box-sizing:border-box;width:100%;max-width:720px;min-height:48px;padding:6px 12px;display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.gc>span:last-child{min-width:0}.gc b,.gc small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.gc b{font-size:13px}.gc small{color:var(--muted);font-size:12px}
.chlogo{position:relative;width:30px;height:30px;border-radius:8px;background:#e9e7ee;display:flex;align-items:center;justify-content:center;overflow:hidden}
.chlogo i{font-style:normal;font-weight:800;font-size:12px;color:#141217}
.chlogo.hasimg i{display:none}
.chlogo.lgdark{background:#26232b}
.chlogo.lglight{background:#f3f2f5}
.chlogo img{position:absolute;left:3px;top:3px;width:24px;height:24px;object-fit:contain}
/* ===== NEMOS rebuild 2026-11-12: one control height (--h-ctl) ===== */
.btn{min-height:var(--h-ctl);display:inline-flex;align-items:center;justify-content:center}
.ptop .pbtn{background:var(--gl-fill);color:var(--ink);border:1px solid var(--line-strong);box-shadow:none;font-size:14px}
.ptop .pbtn:focus{box-shadow:var(--ring);border-color:var(--ink)}
.gs input{min-height:var(--h-ctl)}
.mask:not(:focus){-webkit-text-security:disc}
.sr:focus{box-shadow:var(--ring)}
.srn,.srg,.srg i{font-size:12px}.srn{min-width:96px}
.sr.pre{padding:6px 12px}.sr.pre .srg{display:none}.sr.pre .srs img{width:22px;height:22px}.sr.pre .srs b{font-size:16px}.sr.pre .srm{font-size:18px}
.hmk{font-style:normal;font-size:12px;letter-spacing:.1em;color:var(--muted)}
.empty.noplay{align-items:center;text-align:center;margin:8vh auto 0;max-width:420px}
/* player bar: Feed is the one filled pill; zoom is one button; empty groups vanish */
.ctl #bfeed{background:var(--ink);color:#141217;font-weight:700;max-width:240px}
.ctl .grp:not(:has(button:not([hidden]))){display:none}
.pmenu .pnote{padding:6px 14px;color:var(--muted)}
#tip{position:fixed;left:50%;bottom:max(16px,var(--safe-y));transform:translateX(-50%);z-index:40;max-width:90vw;padding:6px 16px;border-radius:999px;background:var(--gl-fill);border:1px solid var(--line-strong);color:var(--ink);font-weight:600;display:none}#tip.on{display:block}
.keys{color:var(--muted);padding:4px 0 max(6px,var(--safe-y))}
</style></head><body>

<script>if(window.Android)document.documentElement.classList.add("andr");
