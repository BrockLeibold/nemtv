<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEMTV</title>
<style>
/* NEMOS dark tokens, copied from the live local NEMOS (whisper-hub/nemos-src) */
@font-face{font-family:"NemFB";src:local("Inter Bold"),local("Inter-Bold"),local("Roboto Bold"),local("Roboto-Bold"),local("Arial Bold"),local("Arial-BoldMT");font-weight:400}
@font-face{font-family:"Jersey M54";src:url(jersey.ttf) format("truetype");unicode-range:U+002E,U+0030-0039,U+0041-005A,U+0061-007A}
:root{
  --bg:#0F0E11;--surface:#19171C;--surface-2:#242128;--line:#2D2A31;--line-strong:#3B3741;
  --ink:#F2F0F4;--ink-2:#C9C4CF;--muted:#8F8996;--accent:#F0435F;
  --red:#D21F3C;--red-3:#B8182F;--coral:#FF8A5B;--plum:#2B2731;--wine:#5C2330;--island:#211E25;
  --gl-fill:rgba(33,30,37,.62);
  --gl-sheen:linear-gradient(135deg,rgba(255,255,255,.12) 0%,rgba(255,255,255,.03) 45%,rgba(255,255,255,.07) 100%);
  --gl-shadow:0 12px 34px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.18),inset 0 -1px 0 rgba(255,255,255,.05);
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--ink);font:11px/1.35 Inter,system-ui,sans-serif;overflow:hidden}
button,input{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;text-align:inherit}
.disp{font-family:"Jersey M54","NemFB",Inter,sans-serif;text-transform:uppercase;font-synthesis:none;letter-spacing:.02em}

header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:10px 28px 6px}
.brand{justify-self:start;display:flex}.brand img{height:18px}
nav{display:flex;gap:4px;padding:3px;border-radius:999px;background:var(--gl-fill);box-shadow:var(--gl-shadow);border:1px solid var(--line)}
nav{gap:2px}header [data-t]{display:flex;align-items:center;justify-content:center;gap:6px;padding:6px 15px 6px 13px;border-radius:999px;color:var(--ink-2);font-weight:600;text-align:center}nav button svg{flex:none}
#setb{grid-column:3;justify-self:end;width:34px;height:34px;padding:0;border-radius:50%;background:var(--gl-fill);border:1px solid var(--line)}
#setb[aria-pressed=true]{background:rgba(244,242,246,.86)}
header [data-t][aria-pressed=true]{background:rgba(244,242,246,.86);color:#141217}
:focus{outline:none}
button:focus-visible,input:focus-visible,.focusable:focus{box-shadow:0 0 0 3px var(--ink)}


main{height:calc(100% - 44px);overflow-y:auto;overscroll-behavior:contain;padding:4px 28px 24px;scrollbar-width:none}
main::-webkit-scrollbar{display:none}
main::after{content:"";display:block;height:62%}
h2{font-size:15px;margin:10px 0 8px}
.sub{color:var(--muted);margin-bottom:8px}
.empty{color:var(--muted);padding:16px 0}

/* game pills: 16:9 NEMOS orb panels. Away colour fills the left edge, home colour the right */
.grid{display:flex;flex-wrap:wrap;gap:10px}

.pill{--o-base:var(--island);--o-a:var(--red-3);--o-b:var(--wine);--o-c:var(--plum);--o-f1:var(--coral);--o-f2:var(--wine);
  position:relative;isolation:isolate;width:236px;aspect-ratio:16/9;border-radius:22px;text-align:center;color:#fff;
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:14px 10px 10px}
.skin{position:absolute;inset:0;border-radius:inherit;overflow:hidden;z-index:-1;pointer-events:none}
.mesh{position:absolute;inset:-20%;
  background:radial-gradient(55% 70% at 14% 42%,var(--o-a) 0%,transparent 72%),radial-gradient(55% 70% at 86% 58%,var(--o-b) 0%,transparent 72%),radial-gradient(30% 60% at 50% 50%,var(--o-c) 0%,transparent 80%),var(--o-base)}
.pill:focus .mesh{}
@keyframes drift{to{transform:translate(4%,-3%) scale(1.08)}}
.skin::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(90deg,var(--o-f1),transparent 22%,transparent 78%,var(--o-f2));opacity:.55;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.pill .side{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.pill .side img{width:54px;height:54px;object-fit:contain;}
.pill .tm{font-size:11px;line-height:1.05;word-break:break-word}
.pill .mid{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:0 4px}
.pill .vs{color:rgba(255,255,255,.8);font-size:10px}
.pill .sp{position:absolute;top:7px;left:0;right:0;font-size:8px;color:rgba(255,255,255,.85);letter-spacing:.12em}
.pill .live{position:absolute;bottom:6px;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:4px;font-size:8px;color:rgba(255,255,255,.9);font-weight:700;letter-spacing:.1em}
.pill .scr{font-size:19px;line-height:1;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.6);letter-spacing:.02em}
.pill.later{opacity:.82}
.dot{width:5px;height:5px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px rgba(240,67,95,.9);animation:ping 1.6s infinite;display:inline-block}
@keyframes ping{50%{opacity:.35}}
@media(prefers-reduced-motion:reduce){.dot,.pill:focus .mesh{animation:none}}

/* chips (Live filters, Home shortcuts) */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{padding:5px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--ink-2);font-weight:600;white-space:nowrap}
.chip[aria-pressed=true]{background:rgba(244,242,246,.86);color:#141217;border-color:transparent}

/* channel cards: what is on right now */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.cc{position:relative;display:flex;flex-direction:column;gap:3px;padding:9px 12px 10px;border-radius:16px;background:var(--surface);border:1px solid var(--line);min-height:64px;overflow:hidden}
.cc b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:14px}
.cc .nw{color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cc .nw.none{color:var(--muted)}
.cc .star{position:absolute;top:8px;right:10px;color:var(--coral)}
.cc .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--accent);opacity:.9}

/* settings */
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 12px;margin-bottom:5px;border-radius:999px;background:var(--surface);border:1px solid var(--line);width:300px}
.sw{width:26px;height:15px;border-radius:999px;background:var(--line-strong);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:11px;height:11px;border-radius:50%;background:var(--ink-2);transition:transform .12s}
.row[aria-checked=true] .sw{background:var(--ink)}
.row[aria-checked=true] .sw::after{transform:translateX(11px);background:#141217}
.field{display:flex;gap:6px;align-items:center;margin-bottom:10px}
.field input{width:360px;padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line-strong)}
.btn{padding:6px 16px;border-radius:999px;background:rgba(244,242,246,.86);color:#141217;font-weight:700;text-align:center}

/* splash */
#boot{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;transition:opacity .6s}
#boot.out{opacity:0;pointer-events:none}
#boot .orb{position:absolute;border-radius:50%;filter:blur(40px);opacity:.55}
#boot .o1{width:420px;height:420px;left:-80px;top:-120px;background:var(--red-3);animation:fl 14s ease-in-out infinite alternate}
#boot .o2{width:380px;height:380px;right:-60px;bottom:-140px;background:var(--wine);animation:fl 17s ease-in-out infinite alternate-reverse}
#boot .o3{width:260px;height:260px;left:38%;top:30%;background:var(--plum);animation:fl 11s ease-in-out infinite alternate}
@keyframes fl{to{transform:translate(40px,-30px) scale(1.12)}}
#boot .rows{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:30px;opacity:.55}
#boot .r{display:flex;gap:34px;width:max-content;animation:mq 46s linear infinite}
#boot .r:nth-child(2){animation-direction:reverse;animation-duration:58s}
#boot .r img{width:44px;height:44px;object-fit:contain}
@keyframes mq{to{transform:translateX(-50%)}}
#boot .ttl{position:relative;font-size:64px;line-height:1;text-shadow:0 6px 30px rgba(0,0,0,.6)}
#boot .tag{position:relative;color:var(--ink-2);letter-spacing:.28em;font-size:10px}
#boot .bar{position:relative;width:150px;height:4px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:6px}
#boot .bar i{position:absolute;left:0;top:0;bottom:0;width:40%;border-radius:inherit;background:linear-gradient(90deg,var(--red-3),var(--coral));animation:ld 1.3s ease-in-out infinite}
@keyframes ld{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
#boot .st{position:relative;color:var(--muted);font-size:10px;min-height:14px}
@media(prefers-reduced-motion:reduce){#boot *{animation:none!important}}

/* player */
#pl{position:fixed;inset:0;background:#000;display:none;overflow:hidden}
#pl.on{display:block}
#pl video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transform-origin:center}
.ptop,.ctl{position:absolute;left:0;right:0;display:flex;align-items:center;justify-content:center;transition:opacity .2s}
.ptop{top:0;padding:12px 28px;gap:10px;background:linear-gradient(#000b,#0000)}
.ptop img{width:26px;height:26px;object-fit:contain}
.ptop .t{font-size:15px}
.ptop .tag{padding:2px 10px;border-radius:999px;background:var(--gl-fill);border:1px solid var(--line-strong);color:var(--ink-2);font-size:9px;letter-spacing:.1em}
.ctl{bottom:16px;gap:6px;flex-wrap:wrap}
.ctl .grp{display:flex;align-items:center;gap:2px;padding:3px;border-radius:999px;background:var(--gl-fill);box-shadow:var(--gl-shadow);border:1px solid var(--line-strong)}
.ctl button{padding:6px 14px;border-radius:999px;color:var(--ink);font-weight:600;white-space:nowrap;text-align:center}
.ctl button.sm{padding:6px 10px}
.ctl .lbl{color:var(--muted);padding:0 4px 0 10px;font-size:9px;letter-spacing:.1em}
#pl.hide .ptop,#pl.hide .ctl{opacity:0;pointer-events:none}
.pmenu{position:absolute;left:50%;bottom:62px;transform:translateX(-50%);max-height:62%;overflow-y:auto;scrollbar-width:none;min-width:260px;max-width:420px;
  padding:6px;border-radius:22px;background:rgba(25,23,28,.94);box-shadow:var(--gl-shadow);border:1px solid var(--line-strong)}
.pmenu::-webkit-scrollbar{display:none}
.pmenu button{display:flex;justify-content:space-between;gap:12px;width:100%;padding:7px 14px;border-radius:999px;text-align:left}
.pmenu button[aria-checked=true]{background:rgba(242,240,244,.86);color:#141217;font-weight:700}
.pmenu small{color:var(--muted)}
.pmenu button[aria-checked=true] small{color:#4B4652}
.pmenu h3{font-size:9px;color:var(--muted);letter-spacing:.1em;padding:4px 14px 6px}
#pbuf{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;overflow:hidden;background:#09080b;pointer-events:none;
  --o-a:var(--red-3);--o-b:var(--wine)}
#pbuf.on{display:flex}
#pbuf .mesh2{position:absolute;inset:-20%;filter:blur(36px) saturate(1.3);opacity:.85;
  background:radial-gradient(45% 70% at 12% 50%,var(--o-a) 0%,transparent 72%),radial-gradient(45% 70% at 88% 50%,var(--o-b) 0%,transparent 72%),radial-gradient(30% 50% at 50% 50%,var(--plum) 0%,transparent 80%);animation:fl 12s ease-in-out infinite alternate}
#pbuf .tm2{position:relative;display:flex;align-items:center;justify-content:center;gap:34px}
#pbuf .tm2 .tt{display:flex;flex-direction:column;align-items:center;gap:8px;width:190px;text-align:center}
#pbuf .tm2 img{width:92px;height:92px;object-fit:contain;filter:drop-shadow(0 6px 18px rgba(0,0,0,.6));animation:bob 2.4s ease-in-out infinite alternate}
#pbuf .tm2 .tt+.vs2+.tt img{animation-delay:-1.2s}
@keyframes bob{to{transform:translateY(-6px) scale(1.04)}}
#pbuf .nm{font-size:17px;line-height:1.05;text-shadow:0 3px 14px rgba(0,0,0,.6)}
#pbuf .vs2{font-size:13px;color:rgba(255,255,255,.75)}
#pbuf .chn{position:relative;font-size:34px;text-shadow:0 4px 20px rgba(0,0,0,.6)}
#pbuf .bar{position:relative;width:170px;height:4px;border-radius:999px;background:rgba(255,255,255,.14);overflow:hidden;margin-top:6px}
#pbuf .bar i{position:absolute;left:0;top:0;bottom:0;width:40%;border-radius:inherit;background:linear-gradient(90deg,var(--red-3),var(--coral));animation:ld 1.3s ease-in-out infinite}
#pbuf .stt{position:relative;color:var(--ink-2);font-size:11px;min-height:14px;text-align:center}
#pbuf.fail .bar{display:none}
#pbuf.mini{inset:auto;left:50%;top:54px;transform:translateX(-50%);background:var(--gl-fill);border:1px solid var(--line-strong);border-radius:999px;padding:6px 14px;flex-direction:row;gap:10px;box-shadow:var(--gl-shadow);backdrop-filter:blur(8px)}
#pbuf.mini .mesh2,#pbuf.mini .tm2,#pbuf.mini .chn{display:none}
#pbuf.mini .bar{margin:0;width:46px}
@media(prefers-reduced-motion:reduce){#pbuf *{animation:none!important}}
/* hero: featured live game + live cards + team news */
.lz{height:calc(100vh - 62px);display:flex;flex-direction:column;gap:8px}
.lzh{display:flex;align-items:center;justify-content:space-between;flex:none}
.lzh h2{margin:0}
.dots{display:flex;align-items:center;gap:4px;font-size:9px;letter-spacing:.1em;color:var(--ink-2)}
.dots i{width:7px;height:7px;border-radius:50%;background:transparent;box-shadow:inset 0 0 0 1.5px var(--muted)}
.dots i.v{background:#fff;box-shadow:none}
.dots i.c{box-shadow:0 0 0 2px var(--coral);background:#fff}
.dots b{margin-left:6px;color:#fff}
#gd{position:fixed;inset:0;z-index:95;background:#0a090c;display:flex;flex-direction:column}#gd[hidden]{display:none}
#gdh{display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid rgba(255,255,255,.1);flex:none}#gdh .t{flex:1;text-align:right;font-weight:800;font-size:15px}
#gdh button,#gdr button{padding:6px 14px;border-radius:999px;background:rgba(255,255,255,.08);color:#fff;font-weight:700;font-size:11px}
#gdh button[aria-pressed=true],#gdr button[aria-pressed=true]{background:#F2F0F4;color:#141217}#gdr{display:flex;gap:6px;padding:6px 12px;flex:none}#gdr:empty{display:none}
#gdh button:focus,#gdr button:focus{outline:2px solid var(--coral);outline-offset:1px}
#gdb{flex:1;overflow:hidden;padding:0 12px 10px}
.gt{width:100%;border-collapse:collapse;font-size:10px;table-layout:fixed}.gt th{color:var(--muted);font-weight:700;text-align:right;padding:5px 3px;background:#17151b}.gt td{padding:4px 3px;text-align:right;border-bottom:1px solid rgba(255,255,255,.05)}
.gt th:nth-child(1),.gt td:nth-child(1){width:26px;text-align:center}.gt th:nth-child(2),.gt td:nth-child(2){width:116px;text-align:left}.gt td:nth-child(2){font-weight:700}.gt td.z{color:#6b6672}.gt td.h{color:#fff;font-weight:800}
.gs{display:grid;grid-template-columns:1fr 1fr;gap:12px}.gs h3{margin:8px 0 4px;font-size:11px;color:var(--muted);letter-spacing:.08em}
.gsc{display:flex;align-items:center;justify-content:center;gap:18px;padding:10px 0}.gsc .disp{font-size:34px}.gsc img{width:40px;height:40px}.gsc span{font-size:10px;color:var(--muted)}
.ev{display:flex;gap:8px;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:10.5px}.ev b{min-width:36px}.ev em{font-style:normal;color:var(--muted);min-width:56px}.ev.g{color:#fff;font-weight:700}.ev:not(.g){color:var(--ink-2)}
.gsc2{display:flex;justify-content:center}.gsh{display:flex;align-items:center;gap:22px;padding:2px 0 4px}.gsh .disp{font-size:34px}.gsh img{width:38px;height:38px}.gsh span{font-size:11px;color:var(--muted);min-width:70px;text-align:center}
.g3{display:grid;grid-template-columns:.9fr 1.25fr 1fr;gap:12px;align-items:start;padding-bottom:40px}.g3 h3{margin:8px 0 4px;font-size:10px;color:var(--muted);letter-spacing:.08em}
.g3 .ls td img{width:16px;height:16px;vertical-align:middle}.ls th:nth-child(2),.ls td:nth-child(2){width:auto}.ls td:nth-child(n+3),.ls th:nth-child(n+3){text-align:center}
.star{display:flex;gap:8px;align-items:center;background:#15131a;border-radius:12px;padding:5px 8px;margin-bottom:5px}.star img{width:34px;height:34px;border-radius:50%;background:#2a2630;object-fit:cover}.star div{display:flex;flex-direction:column;font-size:10px}.star b{font-size:11px}.star span{color:var(--muted)}.star .hn{color:#fff}
.gc{display:grid;grid-template-columns:34px 1fr auto auto;gap:8px;align-items:center;background:#15131a;border-radius:12px;padding:6px 8px;margin-bottom:5px;box-shadow:inset 3px 0 0 var(--o-a)}.gc .mug{width:34px;height:34px;border-radius:50%;background:#2a2630;object-fit:cover}
.gm{display:flex;flex-direction:column;font-size:10px;min-width:0}.gm b{font-size:11px}.gm span{color:var(--muted)}.ppg{font-style:normal;background:#d21f3c;color:#fff;border-radius:4px;padding:0 4px;margin-left:5px;font-size:9px}
.gsx{display:flex;align-items:center;gap:5px}.sepb{font:800 15px Inter,Roboto,Arial,sans-serif;color:var(--muted)}.gsx img{width:16px;height:16px}.gsx b{font-size:18px}.gtm{display:flex;flex-direction:column;font-size:9.5px;color:var(--muted);min-width:42px;text-align:right}.gtm span:first-child{color:#fff}
.br{margin-bottom:5px}.bv{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;font-size:10px;line-height:1;color:var(--muted)}.bv span{text-align:center}.bv b{color:#fff;font-size:13px;line-height:1}.bv b:last-child{text-align:right}.bb{display:flex;gap:6px;margin-top:1px}.bb i{display:block;height:5px;border-radius:3px;transform:skewX(-20deg)}
#gpop{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center}#gpop[hidden]{display:none}
.pc{--o-a:var(--red-3);--o-b:var(--wine);--o-c:var(--plum);--o-base:var(--island);position:relative;isolation:isolate;width:40vw;aspect-ratio:16/9;border-radius:26px;overflow:hidden;color:#fff;background:#141217}
.pc.done{--o-a:#4a474f!important;--o-b:#3b393f!important;--o-c:#28262c!important;--o-f1:#605d66!important;--o-f2:#605d66!important}
.pi{position:absolute;inset:0;padding:12px 16px 12px;display:flex;flex-direction:column;gap:5px}.pc .ft-mid{flex:1}.pc .ft-team img{width:48px;height:48px}.pc .ft-team .nm{font-size:11px}.pc .ft-sc{font-size:40px}.pc .ft-over{font-size:11px;padding:1px 10px;margin-top:3px}
.pc .tv{font-size:9px;color:rgba(255,255,255,.85);text-align:center}.pb{display:flex;gap:8px;justify-content:center;margin-top:9px}
.pbtn{padding:6px 18px;border-radius:999px;background:rgba(244,242,246,.92);color:#141217;font-weight:800;font-size:11px}.pbtn.alt{background:rgba(0,0,0,.35);color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.7)}
.pbtn:focus{outline:3px solid var(--coral);outline-offset:2px}
.srl{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.sr{position:relative;isolation:isolate;border-radius:18px;padding:10px 12px;color:#fff;text-align:left;display:flex;flex-direction:column;gap:8px;background:linear-gradient(100deg,color-mix(in srgb,var(--o-a) 32%,#141217),#141217 50%,color-mix(in srgb,var(--o-b) 32%,#141217))}
.sr.lv{box-shadow:inset 0 0 0 1.5px var(--coral)}.sr.done{filter:grayscale(.8);opacity:.7}
.srt{display:flex;align-items:center;gap:8px}.srs{display:flex;align-items:center;gap:6px;flex:1}.srs:last-of-type{justify-content:flex-end}
.srs img{width:28px;height:28px}.srs b{font-size:20px}.srm{font-size:26px;min-width:76px;text-align:center}.srn{font-size:10px;color:var(--muted);min-width:64px;text-align:right}
.srg{display:flex;flex-direction:column;gap:2px;font-size:10.5px;background:rgba(10,9,12,.5);border-radius:12px;padding:6px 9px}.srg.none{color:var(--muted)}
.srg i{font-style:normal;font-size:9px;letter-spacing:.08em;color:var(--muted)}.gl em{font-style:normal;color:var(--muted)}.gl.new{color:#fff}.gl:not(.new){opacity:.65}
.gw{flex:1;min-height:0;overflow:hidden;padding:9px 8px 0;margin:0 -8px}
.hero{display:flex;flex-direction:column;gap:12px}

function epgVerdict(c,g){ // 1 = guide names this game, 0 = unknown / generic NHL block, -1 = guide shows something else (or nothing) then

  const rows=(EPG[c.id]||[]).filter(r=>r[0]<g.st+10800000&&r[1]>g.st+1800000);

    if(a&&h)return 1;
    if(a||h){const o=NHL.filter(t=>t[1]!==g.tm[0]&&t[1]!==g.tm[1]&&says(r[2],t[1])).length;if(!o)return 1}

function feedsFor(g){ // strict: NHL network list for this game, checked against the guide (Canada first)
  const seen=new Set(), out=[], add=re=>ch.forEach(c=>{if(re.test(baseName(c.n))&&!seen.has(c.u)){seen.add(c.u);out.push(c)}});
  (g.nets||[]).forEach(n=>NET[n.trim()]&&add(NET[n.trim()]));

    const conf=[];ch.forEach(c=>{if(!seen.has(c.u)&&c.id&&EPG[c.id]&&epgVerdict(c,g)===1){seen.add(c.u);conf.push(c)}}); // e.g. regional channels naming this game

}

    // D-pad just opens the controls (never touches the stream); only dedicated channel keys zap
    if(e.key==="PageUp"||e.key==="PageDown"||e.keyCode===166||e.keyCode===167){e.preventDefault();e.stopPropagation();zap(e.key==="PageDown"||e.keyCode===167?1:-1);show();return}
    e.preventDefault();e.stopPropagation();show();$("#bfeed").focus();return;
  }
  show();
},true);
$("#pl").addEventListener("pointermove",show);
$("#v").addEventListener("playing",()=>msgP(""));
$("#v").addEventListener("waiting",()=>{clearTimeout(waitT);if(!$("#pbuf").classList.contains("on"))waitT=setTimeout(()=>msgP("Buffering...","mini"),700)});
$("#v").addEventListener("error",()=>{if(!hls)msgP("This feed would not play. Open FEED and pick another.","fail")});
$("#pl").onclick=e=>{
  show(); const b=e.target.closest("button"); if(!b)return; const v=$("#v");
  if(b.id==="bfeed")openMenu("feed");
  else if(b.id==="zv")openMenu("zoom");
  else if(b.id==="zm")setZoom(zoom-5);
  else if(b.id==="zp")setZoom(zoom+5);
  else if(b.id==="bfav")toggleFav(cur.c.n);
  else if(b.id==="bpp"){if(v.paused){v.play();b.textContent="Pause"}else{v.pause();b.textContent="Play"}}
  else if(b.id==="bmu"){v.muted=!v.muted;b.textContent=v.muted?"Unmute":"Mute"}
  else if(b.id==="bgd")guideSide();
  else if(b.id==="bcl")stop();
  else if(b.dataset.f!==undefined){closeMenu();tried=new Set();setFeed(cur.feeds[+b.dataset.f]);$("#bfeed").focus()}
  else if(b.dataset.z!==undefined){closeMenu();setZoom(+b.dataset.z);$("#zv").focus()}
};
function toggleFav(n){fav=fav.includes(n)?fav.filter(x=>x!==n):[...fav,n];sv("fav",fav);if(cur&&$("#pl").classList.contains("on"))favBtn()}

/* ---------- data from the TV side ---------- */
function rerender(){ // redraw but keep the remote focus on the same item
  const a=document.activeElement, y=$("#m").scrollTop; let sel=null;
  if(a&&a.closest&&a.closest("main"))for(const k of ["data-g","data-l","data-i","data-grp","data-s"])if(a.hasAttribute(k)){sel=`[${k}="${CSS.escape(a.getAttribute(k))}"]`;break}
  render(); $("#m").scrollTop=y; const n=sel&&$("#m").querySelector(sel); if(n)n.focus();
}
window.gotList=(t,e)=>{
  const c=t?parse(t):[];
  const eu=t&&(t.match(/(?:x-tvg-url|url-tvg)="([^",]+)/)||[])[1]; if(eu&&eu!==EPGURL){EPGURL=eu;sv("epgurl",eu)}
  if(c.length){ch=c;sv("ch",c);msg=c.length+" channels loaded";log("playlist",c.length)}else msg=e?"Failed: "+e:"No channels found in that playlist";
  loadEpg(); render(); $("#bst")&&($("#bst").textContent=c.length?"Loading games...":"Could not load the playlist"); bootOff();
};
function go(t){tab=t;render();(document.querySelector("header [data-t][aria-pressed=true]")).focus()}

function updateDots(){const d=$("#dots"),gw=$("#gw"); if(!d||!gw)return; const R=gw.getBoundingClientRect(); let v=0, h="";
  document.querySelectorAll(".gw .pill").forEach((p,k)=>{const r=p.getBoundingClientRect(), vis=r.top>=R.top-4&&r.bottom<=R.bottom+4; if(vis)v++; h+=`<i class="${vis?"v":""}${k===hi?" c":""}"></i>`});
  d.innerHTML=h+`<b>${v} of ${G.length} showing</b>`}
const markCur=()=>updateDots()||document.querySelectorAll(".grid.lg .pill").forEach(p=>p.classList.toggle("cur",+p.dataset.g===hi));
let slT=0; function slideTo(k,keep){const c=$("#hcar"); if(!c||!c.children[k])return; hi=k; markCur(); cancelAnimationFrame(slT); const x0=c.scrollLeft,d=c.children[k].offsetLeft-x0,t0=performance.now();
  (function f(t){const q=Math.min(1,(t-t0)/160);c.scrollLeft=x0+d*(1-(1-q)*(1-q));if(q<1)slT=requestAnimationFrame(f)})(t0);
  const w=c.children[k].querySelector(".watch"); if(w&&!keep)w.focus({preventScroll:true})}
let scT=0; // light 140ms ease-out scroll: a few scrollTop writes, no layers
function smoothTo(m,y){cancelAnimationFrame(scT);const y0=m.scrollTop,d=y-y0;if(Math.abs(d)<2)return;const t0=performance.now();
  (function f(t){const k=Math.min(1,(t-t0)/140);m.scrollTop=y0+d*(1-(1-k)*(1-k));if(k<1)scT=requestAnimationFrame(f)})(t0)}
function alignRow(el){const gw=el.closest(".gw");
  if(gw){ // live games: the hero stays put, only the games strip scrolls (one row per press)
    smoothTo($("#m"),0); const y=el.getBoundingClientRect().top-gw.getBoundingClientRect().top+gw.scrollTop-9; smoothTo(gw,y); setTimeout(updateDots,200); return}
  const m=$("#m"), g=el.closest(".grid,.cards"), top=g&&g.previousElementSibling&&(/^H2$/.test(g.previousElementSibling.tagName)||g.previousElementSibling.classList.contains("dh"))&&Math.abs(el.offsetTop-g.firstElementChild.offsetTop)<4?g.previousElementSibling:el;
  smoothTo(m,top.getBoundingClientRect().top-m.getBoundingClientRect().top+m.scrollTop-6)}
$("#m").addEventListener("focusin",e=>{const t=e.target; if(t.closest&&t.closest(".grid,.cards")){alignRow(t); if(t.classList.contains("pill")&&t.dataset.g!==undefined&&+t.dataset.g!==hi)slideTo(+t.dataset.g,1)} else if(t.closest&&t.closest(".hcar"))smoothTo($("#m"),0);
});
// D-pad inside the home/live/sports pages: we pick the next item ourselves, so one press = one item and we control the viewport
const ARR={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]};
$("#m").addEventListener("keydown",e=>{
  const d=ARR[e.key]; if(!d)return; const a=document.activeElement; if(!a||!$("#m").contains(a)||a.tagName==="INPUT")return;
  if(a.classList.contains("watch")&&d[0]){e.preventDefault();e.stopPropagation();const sib=a.classList.contains("sumb")?(d[0]<0?a.previousElementSibling:null):(d[0]>0?a.nextElementSibling:null);if(sib){sib.focus({preventScroll:true});return}const k=+a.dataset.g+d[0];if(k>=0&&k<G.length)slideTo(k);return} // carousel: left/right = previous/next live game
  if(d[1]<0){const g=a.closest(".grid:not(.lg)"); // first row of the first later day: Up goes straight back to the hero
    if(g&&g===$("#m").querySelector(".grid:not(.lg)")&&Math.abs(a.offsetTop-g.firstElementChild.offsetTop)<4){const w=document.querySelector('#hcar .watch[data-g="'+hi+'"]');
      if(w){e.preventDefault();e.stopPropagation();w.focus({preventScroll:true});smoothTo($("#m"),0);return}}}
  const ra=a.getBoundingClientRect(), cx=ra.left+ra.width/2, cy=ra.top+ra.height/2; let best=null,bs=1e9, c=[];
  $("#m").querySelectorAll(".focusable").forEach(x=>{if(x===a||!x.offsetParent)return; if(x.classList.contains("watch")&&+x.dataset.g!==hi)return;const r=x.getBoundingClientRect(),ox=r.left+r.width/2-cx,oy=r.top+r.height/2-cy;
    const along=d[0]?ox*d[0]:oy*d[1]; if(along<6)return;
    if(d[0]&&(Math.abs(r.top-ra.top)>20||x.closest('.grid,.hcar')!==a.closest('.grid,.hcar')))return; // sideways stays in the same row of the same grid
    c.push({x,r,ox,oy})});
  if(d[1]&&c.length){const rowTop=d[1]>0?Math.min(...c.map(i=>i.r.top)):Math.max(...c.map(i=>i.r.top)); c=c.filter(i=>Math.abs(i.r.top-rowTop)<30)} // nearest row only
  c.forEach(i=>{const sc=Math.abs(i.ox)+(d[0]?0:0); if(sc<bs){bs=sc;best=i.x}});
  e.preventDefault(); e.stopPropagation();
  if(best){best.focus({preventScroll:true});focusScroll(best)}
  else if(d[1]<0){const n=document.querySelector("header [data-t][aria-pressed=true]");if(n){n.focus();smoothTo($("#m"),0)}}
},true);
function focusScroll(el){if(el.closest(".hcar"))smoothTo($("#m"),0);else if(el.closest(".grid,.cards"))alignRow(el)}
$("header").onclick=e=>{const b=e.target.closest("button");if(b)go(b.dataset.t)};
$("#m").onclick=e=>{
  const ft=e.target.closest("[data-ft]"); if(ft){const k=ft.dataset.ft;favT=favT.includes(k)?favT.filter(x=>x!==k):[...favT,k];sv("favT",favT);ft.setAttribute("aria-pressed",favT.includes(k));return}
  const sr=e.target.closest(".sr"); if(sr)return openGame(+sr.dataset.id);
  const q=e.target.closest("[data-g]"); if(q)return openPop(G[+q.dataset.g]);
  const l=e.target.closest("[data-l]"); if(l)return openPop(L[+l.dataset.l]);
  const p=e.target.closest("[data-i]"); if(p){const c=ch[+p.dataset.i];return play({c,tm:[c.n],t:[{}],s:c.s},tab==="live"?LL:null)}
  const gp=e.target.closest("[data-grp]"); if(gp){grp=gp.dataset.grp;sv("grp",grp);render();$("#m").querySelector(`[data-grp="${CSS.escape(grp)}"]`).focus();return}
  const s=e.target.closest("[data-s]"); if(s){const k=s.dataset.s;off=off.includes(k)?off.filter(x=>x!==k):[...off,k];sv("off",off);render();$("#m").querySelector(`[data-s="${CSS.escape(k)}"]`).focus();return}
  if(e.target.closest("#go")){url=$("#u").value.trim();sv("url",url);msg="Loading...";$("#st").textContent=msg;Android.load(url)}
};
document.addEventListener("keydown",e=>{ // Menu key on a channel card = favorite
  if(e.keyCode===82||e.key==="ContextMenu"){const c=document.activeElement.closest&&document.activeElement.closest("[data-i]");
    if(c&&!$("#pl").classList.contains("on")){toggleFav(ch[+c.dataset.i].n);const i=c.dataset.i;render();const n=$("#m").querySelector(`[data-i="${i}"]`);if(n)n.focus();e.preventDefault()}}
});
render();
const bootAt=Date.now(); let bootDone=false;
(function(){const k=Object.keys(window.LOGO||{}).sort(()=>Math.random()-.5);
  $("#brows").innerHTML=[0,1,2].map(r=>{const l=k.filter((_,i)=>i%3===r),h=l.concat(l).map(a=>`<img src="${window.LOGO[a]}" alt="">`).join("");return `<div class="r">${h}</div>`}).join("")})();
function bootOff(){if(bootDone)return;bootDone=true;const wait=Math.max(0,2200-(Date.now()-bootAt));setTimeout(()=>{$("#boot").classList.add("out");setTimeout(()=>$("#boot").remove(),700);const f=$("#m").querySelector("button,input");if(f)f.focus()},wait)}
setTimeout(bootOff,9000); // never hang on the splash
if(ch.length)bootOff();
log("NEMTV start",new Date().toString(),"games",(window.SCHED||[]).length);
if(window.Android&&(window.CFG||{}).repo)Android.guideSync(CFG.repo,CFG.branch||"main");
if(url&&!ch.length)Android.load(url);else if(url)Android.load(url); // refresh playlist in the background
if(EPGURL)setTimeout(loadEpg,3000); setInterval(loadEpg,10800000); pollScores(); setInterval(pollScores,20000); pollStandings(); setInterval(pollStandings,300000); loadHeroData(); setInterval(loadHeroData,600000);
setTimeout(()=>{if($("#gp").hidden&&!gLoaded){$("#gp").className="tab";gLayout();gLoad()}},6000); // warm the guide so the tab opens instantly
let gSig=""; const gSigOf=()=>{const g=games();return g.live.length+":"+g.later.length+":"+(g.live[0]||{}).st+":"+(g.later[0]||{}).st};
setTimeout(()=>{gSig=gSigOf()},3000);
setInterval(()=>{if((tab==="home"||tab==="live")&&!$("#pl").classList.contains("on")){const n=gSigOf();if(n!==gSig){gSig=n;rerender()}}},60000);
