<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEMTV</title>
<style>
/* NEMOS dark tokens, copied from the live local NEMOS (whisper-hub/nemos-src) */
@font-face{font-family:"NemFB";src:local("Inter Bold"),local("Inter-Bold"),local("Roboto Bold"),local("Roboto-Bold"),local("Arial Bold"),local("Arial-BoldMT");font-weight:400}
@font-face{font-family:"Jersey M54";src:url(jersey.ttf) format("truetype");unicode-range:U+002E,U+0030-0039,U+0041-005A,U+0061-007A}
:root{
  --bg:#0F0E11;--surface:#19171C;--surface-2:#242128;--line:#2D2A31;--line-strong:#3B3741;
  --ink:#F2F0F4;--ink-2:#C9C4CF;--muted:#8F8996;--accent:#F0435F;
  --red:#D21F3C;--red-3:#B8182F;--coral:#FF8A5B;--plum:#2B2731;--wine:#5C2330;--island:#211E25;
  --gl-fill:rgba(33,30,37,.62);
  --gl-sheen:linear-gradient(135deg,rgba(255,255,255,.12) 0%,rgba(255,255,255,.03) 45%,rgba(255,255,255,.07) 100%);
  --gl-shadow:0 12px 34px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.18),inset 0 -1px 0 rgba(255,255,255,.05);
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{display:grid;grid-template-rows:auto minmax(0,1fr)}
html,body{height:100%;background:var(--bg);color:var(--ink);font:11px/1.35 Inter,system-ui,sans-serif;overflow:hidden}
button,input{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;text-align:inherit}
.disp{font-family:"Jersey M54","NemFB",Inter,sans-serif;text-transform:uppercase;font-synthesis:none;letter-spacing:.02em}

header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:10px 28px 6px}
.brand{justify-self:start;display:flex}.brand img{height:18px}
nav{display:flex;gap:4px;padding:3px;border-radius:999px;background:var(--gl-fill);box-shadow:var(--gl-shadow);border:1px solid var(--line)}
nav{gap:2px}header [data-t]{display:flex;align-items:center;justify-content:center;gap:6px;padding:6px 15px 6px 13px;border-radius:999px;color:var(--ink-2);font-weight:600;text-align:center}nav button svg{flex:none}
#setb{grid-column:3;justify-self:end;width:34px;height:34px;padding:0;border-radius:50%;background:var(--gl-fill);border:1px solid var(--line)}
#setb[aria-pressed=true]{background:rgba(244,242,246,.86)}
header [data-t][aria-pressed=true]{background:rgba(244,242,246,.86);color:#141217}
:focus{outline:none}
button:focus-visible,input:focus-visible,.focusable:focus{box-shadow:0 0 0 3px var(--ink)}


main{min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:4px 28px 24px;scrollbar-width:none}
main::-webkit-scrollbar{display:none}
main::after{content:"";display:block;height:62%}
h2{font-size:15px;margin:10px 0 8px}
.sub{color:var(--muted);margin-bottom:8px}
.empty{color:var(--muted);padding:16px 0}
/* skeletons (UI-RULES 25): .sk = a plain block, .skm = a real card drawn by its own renderer with its content hidden, so sizes match. Both fade in after 150ms (a cache hit replaces them before that) and shimmer with one transform-only layer. */
.sk,.skm{position:relative;overflow:hidden;background:var(--surface-2)!important;box-shadow:none!important;filter:none!important;border-color:transparent!important;pointer-events:none;opacity:0;animation:skv 1ms linear .15s forwards}
.sk{display:block;border-radius:6px}
.pg.skm{position:absolute}
.skm *{visibility:hidden}
.sk::after,.skm::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.07),transparent);animation:skm 1.4s linear infinite}
@keyframes skv{to{opacity:1}}@keyframes skm{from{transform:translateX(-100%)}to{transform:translateX(100%)}}@keyframes skbg{to{background-color:var(--surface-2)}}
img[src]:not(.ld){animation:skbg 1ms linear .15s forwards}
@media(prefers-reduced-motion:reduce){.sk::after,.skm::after{animation:none}}
.gv .pw .sk,.mx .sk{position:absolute;inset:0;border-radius:0}.mx .sk{background:#141218!important}
#pbuf .skf{position:absolute;inset:0;border-radius:0;background:rgba(20,18,24,.72)!important}
#pbuf .bar{height:10px!important;border-radius:5px!important}
#pbuf.mini .bar{width:90px!important;height:8px!important}
#pbuf.fail .skf,#pbuf.mini .skf{display:none}
#pbuf:not(.fail) .stt{display:none}

/* game pills: 16:9 NEMOS orb panels. Away colour fills the left edge, home colour the right */
.grid{display:flex;flex-wrap:wrap;gap:10px}

.pill{--o-base:var(--island);--o-a:var(--red-3);--o-b:var(--wine);--o-c:var(--plum);--o-f1:var(--coral);--o-f2:var(--wine);
  position:relative;isolation:isolate;width:236px;aspect-ratio:16/9;border-radius:22px;text-align:center;color:#fff;
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:14px 10px 10px}
.skin{position:absolute;inset:0;border-radius:inherit;overflow:hidden;z-index:-1;pointer-events:none}
.mesh{position:absolute;inset:-20%;
  background:radial-gradient(55% 70% at 14% 42%,var(--o-a) 0%,transparent 72%),radial-gradient(55% 70% at 86% 58%,var(--o-b) 0%,transparent 72%),radial-gradient(30% 60% at 50% 50%,var(--o-c) 0%,transparent 80%),var(--o-base)}
.pill:focus .mesh{}
@keyframes drift{to{transform:translate(4%,-3%) scale(1.08)}}
.skin::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(90deg,var(--o-f1),transparent 22%,transparent 78%,var(--o-f2));opacity:.55;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.pill .side{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.pill .side img{width:54px;height:54px;object-fit:contain;}
.pill .tm{font-size:11px;line-height:1.05;word-break:break-word}
.pill .mid{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:0 4px}
.pill .vs{color:rgba(255,255,255,.8);font-size:10px}
.pill .sp{position:absolute;top:7px;left:0;right:0;font-size:8px;color:rgba(255,255,255,.85);letter-spacing:.12em}
.pill .live{position:absolute;bottom:6px;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:4px;font-size:8px;color:rgba(255,255,255,.9);font-weight:700;letter-spacing:.1em}
.pill .scr{font-size:19px;line-height:1;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.6);letter-spacing:.02em}
.pill.later{opacity:.82}
.dot{width:5px;height:5px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px rgba(240,67,95,.9);animation:ping 1.6s infinite;display:inline-block}
@keyframes ping{50%{opacity:.35}}
@media(prefers-reduced-motion:reduce){.dot,.pill:focus .mesh{animation:none}}

/* chips (Live filters, Home shortcuts) */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{padding:5px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--ink-2);font-weight:600;white-space:nowrap}
.chip[aria-pressed=true]{background:rgba(244,242,246,.86);color:#141217;border-color:transparent}

/* channel cards: what is on right now */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.cc{position:relative;display:flex;flex-direction:column;gap:3px;padding:9px 12px 10px;border-radius:16px;background:var(--surface);border:1px solid var(--line);min-height:64px;overflow:hidden}
.cc b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:14px}
.cc .nw{color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cc .nw.none{color:var(--muted)}
.cc .star{position:absolute;top:8px;right:10px;color:var(--coral)}
.cc .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--accent);opacity:.9}

/* settings */
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 12px;margin-bottom:5px;border-radius:999px;background:var(--surface);border:1px solid var(--line);width:300px}
.sw{width:26px;height:15px;border-radius:999px;background:var(--line-strong);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:11px;height:11px;border-radius:50%;background:var(--ink-2);transition:transform .12s}
.row[aria-checked=true] .sw{background:var(--ink)}
.row[aria-checked=true] .sw::after{transform:translateX(11px);background:#141217}
.field{display:flex;gap:6px;align-items:center;margin-bottom:10px}
.field input{width:360px;padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line-strong)}
.btn{padding:6px 16px;border-radius:999px;background:rgba(244,242,246,.86);color:#141217;font-weight:700;text-align:center}

/* splash */
#boot{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;transition:opacity .6s}
#boot.out{opacity:0;pointer-events:none}
#boot .orb{position:absolute;border-radius:50%;filter:blur(40px);opacity:.55}
#boot .o1{width:420px;height:420px;left:-80px;top:-120px;background:var(--red-3);animation:fl 14s ease-in-out infinite alternate}
#boot .o2{width:380px;height:380px;right:-60px;bottom:-140px;background:var(--wine);animation:fl 17s ease-in-out infinite alternate-reverse}
#boot .o3{width:260px;height:260px;left:38%;top:30%;background:var(--plum);animation:fl 11s ease-in-out infinite alternate}
@keyframes fl{to{transform:translate(40px,-30px) scale(1.12)}}
#boot .rows{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:30px;opacity:.55}
#boot .r{display:flex;gap:34px;width:max-content;animation:mq 46s linear infinite}
#boot .r:nth-child(2){animation-direction:reverse;animation-duration:58s}
#boot .r img{width:44px;height:44px;object-fit:contain}
@keyframes mq{to{transform:translateX(-50%)}}
#boot .ttl{position:relative;font-size:64px;line-height:1;text-shadow:0 6px 30px rgba(0,0,0,.6)}
#boot .tag{position:relative;color:var(--ink-2);letter-spacing:.28em;font-size:10px}
#boot .bar{position:relative;width:150px;height:4px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:6px}
#boot .bar i{position:absolute;left:0;top:0;bottom:0;width:40%;border-radius:inherit;background:linear-gradient(90deg,var(--red-3),var(--coral));animation:ld 1.3s ease-in-out infinite}
@keyframes ld{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
#boot .st{position:relative;color:var(--muted);font-size:10px;min-height:14px}
@media(prefers-reduced-motion:reduce){#boot *:not(.sk){animation:none!important}}

/* player */
#pl{position:fixed;inset:0;z-index:50;background:#000;display:none;overflow:hidden}
#pl.on{display:block}
#pl video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transform-origin:center}
.ptop,.ctl{position:absolute;left:0;right:0;display:flex;align-items:center;justify-content:center;transition:opacity .2s}
.ptop{top:0;padding:12px 28px;gap:10px;background:linear-gradient(#000b,#0000)}
.ptop .ptt{flex:1;display:flex;align-items:center;justify-content:center;gap:10px;min-width:0}
.pbtn{padding:12px 26px;border-radius:999px;background:var(--gl-fill);border:2px solid var(--line-strong);box-shadow:var(--gl-shadow);color:var(--ink);font-weight:700;font-size:20px;white-space:nowrap}
.pbtn:focus-visible{border-color:var(--ink)}
.ptop img{width:26px;height:26px;object-fit:contain}
.ptop .t{font-size:15px}
.ptop .tag{padding:2px 10px;border-radius:999px;background:var(--gl-fill);border:1px solid var(--line-strong);color:var(--ink-2);font-size:9px;letter-spacing:.1em}
.ctl{bottom:16px;gap:6px;flex-wrap:wrap}
.ctl .grp{display:flex;align-items:center;gap:2px;padding:3px;border-radius:999px;background:var(--gl-fill);box-shadow:var(--gl-shadow);border:1px solid var(--line-strong)}
.ctl button{padding:6px 14px;border-radius:999px;color:var(--ink);font-weight:600;white-space:nowrap;text-align:center}
.ctl button.sm{padding:6px 10px}
.ctl .lbl{color:var(--muted);padding:0 4px 0 10px;font-size:9px;letter-spacing:.1em}
#pl.hide,#pl.hide *{cursor:none}
#pl.hide .ptop,#pl.hide .ctl{opacity:0;pointer-events:none}
.ctl button[aria-pressed=true]{background:rgba(244,242,246,.86);color:#141217}
/* score bar: 8% of the player, pinned to the top (controls live at the bottom). Visible only while the player UI is hidden, or while picking a game (Change game) */
#sbar{position:fixed;left:0;right:0;top:0;height:8%;z-index:70;display:none;gap:2px;padding:2px;background:var(--gl-fill);overflow-x:auto;overflow-y:hidden;scrollbar-width:none;container-type:size;opacity:0;pointer-events:none;transition:opacity .2s}
#sbar::-webkit-scrollbar{display:none}
#sbar.on{display:flex}
#sbar.vis,#sbar.pick{opacity:1;pointer-events:auto}
#sbar.vis *{cursor:pointer}
body.sbp #pl .ptop,body.sbp #pl .ctl,body.sbp #mv .ctl,body.sbp #mv .ml,body.sbp #mv .pmenu{opacity:0;pointer-events:none}
body.sbp,body.sbp *{cursor:default}body.sbp .sbi:not(.off){cursor:pointer}
.sbi{--o-base:var(--island);--o-a:var(--red-3);--o-b:var(--wine);--o-c:var(--plum);--o-f1:var(--coral);--o-f2:var(--wine);position:relative;isolation:isolate;flex:1 0 112px;min-width:0;height:100%;border-radius:12px;text-align:center;color:#fff;display:grid;grid-template-columns:1fr auto 1fr;grid-template-rows:1fr auto;align-items:center;justify-items:center;padding:1px 4px}
.sbi img,.sbi b{width:clamp(14px,46cqh,28px);height:clamp(14px,46cqh,28px);object-fit:contain;font-size:clamp(9px,30cqh,13px);line-height:clamp(14px,46cqh,28px);overflow:hidden}
.sbi .scr{font-size:clamp(11px,38cqh,20px);line-height:1;text-shadow:0 2px 10px rgba(0,0,0,.6);white-space:nowrap}
.sbi .nt{grid-column:1/-1;font-size:clamp(9px,20cqh,12px);line-height:1;font-weight:700;letter-spacing:.06em;color:rgba(255,255,255,.9);white-space:nowrap}
.sbi.done{--o-a:#4a474f!important;--o-b:#3b393f!important;--o-c:#28262c!important;--o-f1:#605d66!important;--o-f2:#605d66!important}
.sbi.off{opacity:.45}
.sbi.cur{box-shadow:inset 0 0 0 2px var(--coral)}
.sbi:focus{box-shadow:inset 0 0 0 3px var(--ink)}
.sbe{margin:auto;color:var(--ink-2);font-size:11px}
/* multiview: tiles are absolutely positioned boxes that only ever change left/top/width/height (never reparented) */
#pl.mvh{display:none!important}
#mv{position:fixed;inset:0;z-index:60;background:#000;display:none;overflow:hidden;outline:none}
#mv.on{display:block}
.mt{position:absolute;overflow:hidden;background:#000}
.mt video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transform-origin:center}
.mt.au::after,.mt.fo::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:5;transition:opacity .25s}
.mt.pipi,.mt.pipi video{background:transparent}
.mt.au::after{border:2px solid #fff}
.mt.fo::before{border:3px dashed var(--red-3,#e33);z-index:6}
.ml{position:absolute;left:6px;top:6px;z-index:4;padding:2px 10px;border-radius:999px;background:#000b;color:#fff;font-size:11px;font-weight:700;letter-spacing:.04em;pointer-events:none;max-width:90%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mx{position:absolute;inset:0;z-index:3;display:flex;align-items:center;justify-content:center;padding:8px;color:#cfcbd2;font-size:12px;text-align:center;pointer-events:none}
.mx:empty{display:none}
#mv .ctl,#mv .pmenu,#mvt{z-index:20}
#mvp{bottom:104px}
#mvt{position:absolute;top:12px;left:50%;transform:translateX(-50%);padding:6px 16px;border-radius:999px;background:#000c;color:#fff;font-weight:700;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
#mvt.on{opacity:1}
#mv.hide .ml,#mv.hide .ctl,#mv.hide .pmenu,#mv.hide #mvt{opacity:0;pointer-events:none}
#mv.hide .mt.fo::before,#mv.hide .mt.au::after{opacity:0}
#mvm{z-index:25;transform:none;bottom:auto;right:auto;min-width:200px;max-width:320px}#mvm[hidden]{display:none}
#mvm button.sel{background:rgba(242,240,244,.86);color:#141217;font-weight:700}#mvm button.sel small{color:#4B4652}
#mv.hide,#mv.hide *{cursor:none}
@media(max-width:700px){#mvb button{padding:10px 12px}#mvb{bottom:10px}#mvp{bottom:150px}}
.pmenu{position:absolute;left:50%;bottom:62px;transform:translateX(-50%);max-height:62%;overflow-y:auto;scrollbar-width:none;min-width:260px;max-width:420px;
  padding:6px;border-radius:22px;background:rgba(25,23,28,.94);box-shadow:var(--gl-shadow);border:1px solid var(--line-strong)}
.pmenu::-webkit-scrollbar{display:none}
.pmenu button{display:flex;justify-content:space-between;gap:12px;width:100%;padding:7px 14px;border-radius:999px;text-align:left}
.pmenu button[aria-checked=true]{background:rgba(242,240,244,.86);color:#141217;font-weight:700}
.pmenu small{color:var(--muted)}
.pmenu button[aria-checked=true] small{color:#4B4652}
.pmenu input{width:100%;margin:2px 0 6px;padding:7px 14px;border-radius:999px;border:0;background:rgba(0,0,0,.35);color:#fff;font:inherit;font-size:12px}.pmenu input:focus{outline:3px solid var(--coral);outline-offset:1px}
.pmenu h3{font-size:9px;color:var(--muted);letter-spacing:.1em;padding:4px 14px 6px}
#pbuf{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;overflow:hidden;background:#09080b;pointer-events:none;
  --o-a:var(--red-3);--o-b:var(--wine)}
#pbuf.on{display:flex}
#pbuf .mesh2{position:absolute;inset:-20%;filter:blur(36px) saturate(1.3);opacity:.85;
  background:radial-gradient(45% 70% at 12% 50%,var(--o-a) 0%,transparent 72%),radial-gradient(45% 70% at 88% 50%,var(--o-b) 0%,transparent 72%),radial-gradient(30% 50% at 50% 50%,var(--plum) 0%,transparent 80%);animation:fl 12s ease-in-out infinite alternate}
#pbuf .tm2{position:relative;display:flex;align-items:center;justify-content:center;gap:34px}
#pbuf .tm2 .tt{display:flex;flex-direction:column;align-items:center;gap:8px;width:190px;text-align:center}
#pbuf .tm2 img{width:92px;height:92px;object-fit:contain;filter:drop-shadow(0 6px 18px rgba(0,0,0,.6));animation:bob 2.4s ease-in-out infinite alternate}
#pbuf .tm2 .tt+.vs2+.tt img{animation-delay:-1.2s}
@keyframes bob{to{transform:translateY(-6px) scale(1.04)}}
#pbuf .nm{font-size:17px;line-height:1.05;text-shadow:0 3px 14px rgba(0,0,0,.6)}
#pbuf .vs2{font-size:13px;color:rgba(255,255,255,.75)}
#pbuf .chn{position:relative;font-size:34px;text-shadow:0 4px 20px rgba(0,0,0,.6)}
#pbuf .bar{position:relative;width:170px;height:4px;border-radius:999px;background:rgba(255,255,255,.14);overflow:hidden;margin-top:6px}
#pbuf .bar i{position:absolute;left:0;top:0;bottom:0;width:40%;border-radius:inherit;background:linear-gradient(90deg,var(--red-3),var(--coral));animation:ld 1.3s ease-in-out infinite}
#pbuf .stt{position:relative;color:var(--ink-2);font-size:11px;min-height:14px;text-align:center}
#pbuf.fail .bar{display:none}
#pbuf.mini{inset:auto;left:50%;top:54px;transform:translateX(-50%);background:var(--gl-fill);border:1px solid var(--line-strong);border-radius:999px;padding:6px 14px;flex-direction:row;gap:10px;box-shadow:var(--gl-shadow);backdrop-filter:blur(8px)}
#pbuf.mini .mesh2,#pbuf.mini .tm2,#pbuf.mini .chn{display:none}
#pbuf.mini .bar{margin:0;width:46px}
@media(prefers-reduced-motion:reduce){#pbuf *:not(.sk){animation:none!important}}
/* hero: featured live game + live cards + team news */
/* home = ONE grid that owns every cell: title row, hero cell, game-strip cell. Cells size the content; too small = main scrolls */
.lz{height:100%;min-height:340px;display:grid;grid-template-rows:auto minmax(0,3fr) minmax(0,2fr);gap:8px}
.lzh{display:flex;align-items:center;justify-content:space-between;flex:none}
.lzh h2{margin:0}
.dots{display:flex;align-items:center;gap:4px;font-size:9px;letter-spacing:.1em;color:var(--ink-2)}
.dots i{width:7px;height:7px;border-radius:50%;background:transparent;box-shadow:inset 0 0 0 1.5px var(--muted)}
.dots i.v{background:#fff;box-shadow:none}
.dots i.c{box-shadow:0 0 0 2px var(--coral);background:#fff}
.dots b{margin-left:6px;color:#fff}
#gd{position:fixed;inset:0;z-index:95;background:#0a090c;display:flex;flex-direction:column}#gd[hidden]{display:none}
#gdh{display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid rgba(255,255,255,.1);flex:none}#gdh .t{flex:1;text-align:right;font-weight:800;font-size:15px}
#gdh button,#gdr button{padding:6px 14px;border-radius:999px;background:rgba(255,255,255,.08);color:#fff;font-weight:700;font-size:11px}
#gdh button[aria-pressed=true],#gdr button[aria-pressed=true]{background:#F2F0F4;color:#141217}#gdr{display:flex;gap:6px;padding:6px 12px;flex:none}#gdr:empty{display:none}
#gdh button:focus,#gdr button:focus{outline:2px solid var(--coral);outline-offset:1px}

  const pick=catPick?ckeys().find(c=>ckey(c)===catPick):null;
  return `<h2 class="disp" style="margin-top:14px">Channel categories</h2><div class="sub">Move any channel to another category. The Live page updates at once.</div>
    <div class="chips">${catList.map(x=>`<button class="chip focusable" data-cc-sel="${esc(x)}" aria-pressed="${x===sel}">${esc(x)} &middot; ${cnt[x]||0}</button>`).join("")}</div>
    <div class="field"><input id="cc-new" class="focusable" placeholder="New category name"><button class="btn focusable" data-cc-act="add">Add category</button></div>
    <div class="field"><input id="cc-ren" class="focusable" placeholder="Rename ${esc(sel)} to"><button class="btn focusable" data-cc-act="rename" data-cc-cat="${esc(sel)}">Rename</button>${sel&&sel!=="Other"?`<button class="btn focusable" data-cc-act="delete" data-cc-cat="${esc(sel)}">Delete</button>`:""}</div>
    <div class="field"><input id="cc-q" class="focusable" type="search" placeholder="Search channels" value="${esc(catQ)}"></div>
    <div id="ccl" class="ccl">${catListHTML()}</div>
    ${pick?`<div class="sub">Move <b>${esc(baseName(pick.n))}</b> to:</div><div class="chips">${catList.map(x=>`<button class="chip focusable" data-cc-set="${esc(x)}">${esc(x)}</button>`).join("")}</div>`:""}`;
}
function catClick(b){const d=b.dataset, q=v=>'"'+CSS.escape(String(v))+'"', redo=s=>{render();const n=s&&$("#m").querySelector(s);if(n)n.focus()};
  if(d.ccSel!==undefined){catSel=d.ccSel;catPick=null;return redo('[data-cc-sel='+q(d.ccSel)+']')}
  if(d.ccCh!==undefined){catPick=catPick===d.ccCh?null:d.ccCh;return redo('[data-cc-ch='+q(d.ccCh)+']')}
  if(d.ccSet!==undefined){const k=catPick;catPick=null;if(k)catMove(k,d.ccSet);return redo('[data-cc-ch='+q(k)+']')}
  if(d.ccAct==="add"){const v=$("#cc-new").value;if(catAdd(v))catSel=v.trim();catPick=null;return redo('[data-cc-sel='+q(catSel)+']')}
  if(d.ccAct==="rename"){const v=$("#cc-ren").value;if(catRename(d.ccCat,v))catSel=v.trim();return redo('[data-cc-sel='+q(catSel)+']')}
  if(d.ccAct==="delete"){catDelete(d.ccCat);catSel=null;return redo(null)}
}

  const l=e.target.closest("[data-l]"); if(l)return openPop(L[+l.dataset.l]);
  const p=e.target.closest("[data-i]"); if(p){const c=ch[+p.dataset.i];return play({c,tm:[c.n],t:[{}],s:c.s},tab==="live"?LL:null)}
  const gp=e.target.closest("[data-grp]"); if(gp){grp=gp.dataset.grp;sv("grp",grp);render();$("#m").querySelector(`[data-grp="${CSS.escape(grp)}"]`).focus();return}
  const s=e.target.closest("[data-s]"); if(s){const k=s.dataset.s;off=off.includes(k)?off.filter(x=>x!==k):[...off,k];sv("off",off);render();$("#m").querySelector(`[data-s="${CSS.escape(k)}"]`).focus();return}
  if(e.target.closest("#go")){url=$("#u").value.trim();sv("url",url);msg="Loading...";$("#st").innerHTML=SKL;Android.load(url)}
};

  if(e.key!=="Backspace"||tab!=="live"||$("#pl").classList.contains("on"))return;
